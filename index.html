<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di Kerjaku</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2069&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Overlay untuk membuat teks lebih mudah dibaca */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .welcome-box {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .text-primary {
            color: #007bff !important;
            font-size: 3rem;
            display: block;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,123,255,0.2);
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-custom {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            border: none;
            color: white;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,123,255,0.3);
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,123,255,0.4);
            background: linear-gradient(135deg, #0056b3 0%, #004094 100%);
            color: white;
        }

        .btn-custom:active {
            transform: translateY(-1px);
        }

        /* Info tambahan */
        .footer-info {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 0.9rem;
            z-index: 2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .footer-info a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-box {
                padding: 30px 20px;
                margin: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .text-primary {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }

            .btn-custom {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .text-primary {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="welcome-box">
            <h1 class="mb-4">
                Selamat Datang di 
                <br>
                <span class="text-primary">KERJAKU</span>
            </h1>
            <p class="mb-4">Sistem Informasi Manajemen Data Pegawai</p>
            
            <!-- Link ke halaman login -->
            <a href="#" onclick="showNotification()" class="btn btn-custom">Masuk ke Sistem</a>
            
            <!-- Pesan notifikasi (karena di HTML murni tidak bisa proses login) -->
            <div id="notification" style="display: none; margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border-radius: 10px; border: 1px solid #c3e6cb;">
                <strong>Info:</strong> Halaman login akan tersedia setelah website di-deploy dengan PHP. Untuk demo, ini adalah halaman statis HTML.
            </div>
        </div>
    </div>

    <!-- Footer info -->
    <div class="footer-info">
        <p>© 2024 KERJAKU - Sistem Informasi Manajemen Data Pegawai | 
            <a href="https://github.com" target="_blank">GitHub Pages Version</a>
        </p>
    </div>

    <!-- Bootstrap JS (optional, untuk komponen interaktif) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript sederhana -->
    <script>
        function showNotification() {
            const notification = document.getElementById('notification');
            if (notification.style.display === 'none' || notification.style.display === '') {
                notification.style.display = 'block';
                // Auto hide setelah 5 detik
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 5000);
            } else {
                notification.style.display = 'none';
            }
        }

        // Efek tambahan: animasi saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Halaman KERJAKU siap!');
        });
    </script>
</body>
</html>
